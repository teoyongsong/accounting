version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: sg-accounting-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sg_accounting
      MYSQL_USER: sg_accounting
      MYSQL_PASSWORD: sg_accounting
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]

volumes:
  mysql_data:
